<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไม่พบหน้านี้ · ระบบสต๊อก</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#00843d">
  <link rel="icon" type="image/png" href="/appstock/icons/icon-192.png">
  <!-- หน้า 404 ของ GitHub Pages (ลิงก์ผิด/หน้าที่ถูกลบ) — เดิมเป็นหน้าภาษาอังกฤษของ GitHub · QA 2026-10-10
       ไม่โหลดอะไรจากภายนอก (ฟอนต์ Sarabun ที่เก็บในแอป) · ลิงก์กลับคำนวณจากที่อยู่จริง (เว็บจริงอยู่ใต้ /appstock/) -->
  <link rel="stylesheet" href="/appstock/fonts/sarabun.css">
  <link rel="stylesheet" href="/appstock/fonts/kanit.css">
  <style>
    :root { --ink:#111; --ink2:#3d3d3d; --muted:#5c5c57; --accent:#00843d; --accent-dark:#006b31; --band:#f2951c; --ground:#f2f2ef; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
           background:var(--ground); color:var(--ink); font-family:"Sarabun","Segoe UI",system-ui,sans-serif; }
    .card { background:#fff; max-width:420px; width:100%; padding:32px 24px; text-align:center;
            border:2px solid var(--accent); border-top:10px solid var(--accent); box-shadow:inset 0 6px 0 var(--band); }
    .ic { width:56px; height:56px; margin:0 auto; color:var(--accent); }
    h1 { font-size:24px; margin:14px 0 6px; font-family:"Kanit","Sarabun",sans-serif; }
    p { color:var(--ink2); font-size:15px; line-height:1.6; margin:0 0 20px; }
    a.btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:12px 22px; border-radius:6px;
            background:var(--accent); color:#fff; font-weight:800; font-size:16px; text-decoration:none; }
    a.btn:hover, a.btn:focus-visible { background:var(--accent-dark); outline:3px solid var(--band); outline-offset:2px; }
    .small { margin-top:14px; font-size:13px; color:var(--muted); }
    .small a { color:var(--ink2); font-weight:700; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></svg>
    <h1>ไม่พบหน้านี้</h1>
    <p>ลิงก์อาจพิมพ์ผิดหรือหน้าถูกย้ายแล้ว<br>กดปุ่มด้านล่างเพื่อกลับเข้าระบบสต๊อก</p>
    <a class="btn" id="homeLink" href="/appstock/">← กลับเข้าระบบ</a>
    <div class="small"><a id="manualLink" href="/appstock/manual.html">คู่มือการใช้งาน</a></div>
  </main>
  <script>
    // เว็บจริงอยู่ใต้ /appstock/ · เปิดในเครื่อง (localhost) อยู่ที่ราก "/"
    (function () {
      var base = location.pathname.indexOf("/appstock/") === 0 ? "/appstock/" : "/";
      document.getElementById("homeLink").setAttribute("href", base);
      document.getElementById("manualLink").setAttribute("href", base + "manual.html");
    })();
  </script>
</body>
</html>
