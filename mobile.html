async function loadData(opts) {
  opts = opts || {};
  const m0 = mod;   // ข้อ 8: ผู้ใช้กดกลับแล้วเข้าคลังอื่นระหว่างรอ คำตอบเก่าต้องไม่ไปโผล่
  // ข้อ 4: เพิ่งเปิดคลังนี้แต่มีรายการเดิมในเครื่อง → โชว์ก่อนทันที (ป้าย "กำลังตรวจ") แล้วค่อยแทนที่ · รีเฟรชแบบเงียบไม่บังจอ
  let quiet = !!opts.silent;
  if (!quiet && _mShownMod !== mod) {
    const c = mCacheGet("list_" + mod);
    if (c && c.d.length) {
      data = c.d; populateDropdown(); _filterListNow();
      const s0 = $("mSub"); if (s0) s0.textContent = user + " · " + MOD_CFG[mod].sub + " · ข้อมูลเมื่อ " + new Date(c.t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " · กำลังตรวจ...";
      quiet = true;
    }
  }
  if (!quiet) setLoading(true, "กำลังโหลดข้อมูล...");
  try {
    let fresh;
    if (mod === "COLDROOM") {
      // ข้อ 5: ขอเฉพาะที่มือถือใช้ (allLots) ไม่ต้องแบก totalByProduct/expiring/expired
      const [r, pr] = await Promise.all([
        gasPost({ module: "COLDROOM", action: "getStartupOverview", payload: { lite: true } }),
        gasPost({ module: "COLDROOM", action: "getColdRoomProducts" }).catch(() => null)
      ]);
      if (m0 === mod && r.staleDays !== undefined) mStoreSet("m_staledays_" + mod, Number(r.staleDays) || 0);
      // Aggregate lots by barcode, keep individual lots for counting
      const byBc = {};
      (r.allLots || []).forEach(lot => {
        const bc = String(lot.Barcode || "");
        if (!byBc[bc]) byBc[bc] = { sku: bc, name: lot.ProductName || "", qty: 0, unit: lot.Unit || "", min: 0, daily: 0, cr: true, lots: [], shelfDays: 0 };
        byBc[bc].qty += Number(lot.Qty || 0);
        // คำนวณ shelf life จาก MFG-EXP ของ lot แรก
        if (!byBc[bc].shelfDays && lot.MFG && lot.EXP) {
          const sd = Math.round((new Date(lot.EXP) - new Date(lot.MFG)) / 86400000);
          if (sd > 0) byBc[bc].shelfDays = sd;
        }
        byBc[bc].lots.push({
          mfg: lot.MFG || "", exp: lot.EXP || "",
          qty: Number(lot.Qty || 0), unit: lot.Unit || "",
          expDays: lot.ExpireDays, expStatus: lot.ExpireStatus || "ปกติ",
          idle: lot.IdleDays, stale: !!lot.Stale   // ⏰ หลังบ้านตัดสินให้แล้ว
        });
      });
      // ⛔ FEFO: ล็อตที่หมดอายุก่อนอยู่บนสุด (เดิมเรียงตามลำดับที่บันทึก พนักงานกดเบิกล็อตแรก ของเก่าค้างคลัง — QA M2)
      //    สถานะหมดอายุระดับสินค้า = ล็อตที่แย่ที่สุด (หมดแล้ว > ใกล้หมด) ใช้ทำป้าย/ตัวกรองในรายการ
      const _crSt = t => t === "หมดอายุ" ? "expired" : t === "ใกล้หมดอายุ" ? "near" : "";
      Object.values(byBc).forEach(p => {
        p.lots.sort((a, b) => String(a.exp || "9999").localeCompare(String(b.exp || "9999")) || String(a.mfg).localeCompare(String(b.mfg)));
        const worst = p.lots.map(l => _crSt(l.expStatus)).sort((a, b) => (a === "expired" ? 0 : a === "near" ? 1 : 2) - (b === "expired" ? 0 : b === "near" ? 1 : 2))[0] || "";
        p.expStatus = worst;
        const ds = p.lots.map(l => Number(l.expDays)).filter(n => isFinite(n));
        p.expDays = ds.length ? Math.min(...ds) : null;
      });
      // ⏰ ระดับสินค้า = ล็อตที่ค้างนานที่สุด (มีล็อตที่ไม่เคยบันทึก = null) — ใช้กรอง/ป้ายในรายการ
      Object.values(byBc).forEach(p => {
        if (!p.lots.some(l => l.idle !== undefined)) return;
        p.idle = p.lots.some(l => l.idle === null) ? null : Math.max(...p.lots.map(l => Number(l.idle) || 0));
      });
      // สินค้าที่ลงทะเบียนแต่ยังไม่มีล็อตคงเหลือ — ต้องแตะได้ ไม่งั้นรับเข้าล็อตแรกจากมือถือไม่ได้ (เดิมขึ้นเฉพาะที่มียอด)
      ((pr && pr.products) || []).forEach(p => {
        const bc = String(p.Barcode || "");
        if (!bc || byBc[bc]) return;
        byBc[bc] = { sku: bc, name: p.ProductName || bc, qty: 0, unit: p.DefaultUnit || "", min: 0, daily: 0, cr: true, lots: [],
                     shelfDays: Number(p.StandardShelfLifeDays) || 0 };
      });
      fresh = Object.values(byBc).sort((a,b) => a.name.localeCompare(b.name,"th"));
    } else {
      const res = await fetch(`${GAS_URL}?module=${mod}`);
      const r   = await gasJson(res);
      // งานที่คนในคลังนี้เพิ่งเบิกไปใช้ (ช่องที่ 9 ของประวัติ) — เอาไปทำปุ่มเลือกงาน
      if (m0 === mod) {
        const seen = [];
        (r.recentHistory || []).forEach(h => {
          const p = String((h && h[8]) || "").trim();
          if (p && String(h[2] || "") === "เบิกออก" && seen.indexOf(p) < 0) seen.push(p);
        });
        mStoreSet("m_purposes_srv_" + mod, seen.slice(0, 12));
        if (r.staleDays !== undefined) mStoreSet("m_staledays_" + mod, Number(r.staleDays) || 0);
      }
      fresh = (r.materials || [])
        .filter(m => !m.Discontinued)
        .map(m => ({
          sku:   String(m.SKU   || ""),
          name:  m.Name  || "",
          qty:   Number(m.Qty   || 0),
          unit:  m.Unit  || "",
          min:   Number(m.Min   || 0),
          daily: Number(m.DailyUsage || 0),
          // วันพอใช้/สถานะการสั่ง คิดที่หลังบ้าน (เดิมคิด qty ÷ ใช้ต่อวัน ที่เครื่อง → ไม่ตรงจอต้องสั่ง · critique 2026-10-20)
          daysCover: m.DaysCover === undefined || m.DaysCover === "" ? null : m.DaysCover,
          planStatus: m.PlanStatus || "", planText: m.PlanStatusText || "",
          idle:  m.IdleDays === undefined ? undefined : m.IdleDays,   // ⏰ วันที่ไม่มีการอัปเดต (หลังบ้านนับให้)
          expDays: m.ExpDays === undefined ? null : m.ExpDays,        // ⛔ อีกกี่วันหมดอายุ (หลังบ้านคิดให้ · ติดลบ = เลยแล้ว)
          expStatus: m.ExpStatus || "",                              //    "expired" | "near" | ""
          cr:    false
        }))
        .sort((a, b) => a.name.localeCompare(b.name, "th"));
    }
    if (!quiet) setLoading(false);
    if (m0 !== mod) return;
    data = fresh;
    mCacheSet("list_" + mod, data);
    _mShownMod = mod;
    populateDropdown();
    _filterListNow();        // คงตัวกรอง/คำค้นที่เลือกไว้ ไม่เด้งกลับไป "ทั้งหมด" ทุกครั้งที่รีเฟรช
    planRefreshBadge();      // ป้ายจำนวนที่ต้องสั่ง — ดึงเบื้องหลัง ไม่ถ่วงรายการ
    const _age = $("mSub"); if (_age) _age.textContent = user + " · " + MOD_CFG[mod].sub + " · อัปเดต " + new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
    if (!quiet) toast("โหลดข้อมูลสำเร็จ · " + data.length + " รายการ");
    loadData._retried = false;
  } catch(e) {
    if (!quiet) setLoading(false);
    // Google สะดุดชั่วคราว → ลองใหม่เองหนึ่งครั้งก่อนโชว์ข้อผิดพลาด
    if (!loadData._retried && navigator.onLine) {
      loadData._retried = true;
      toast("⏳ เซิร์ฟเวอร์ตอบไม่ปกติ กำลังลองใหม่...", "err");
      setTimeout(loadData, 4000);
      return;
    }
    if (quiet) { const sF = $("mSub"); if (sF) sF.textContent = sF.textContent.replace("กำลังตรวจ...", "ตรวจล่าสุดไม่ได้ (ของเดิม)"); }
    else if (m0 === mod && _mShownMod !== mod) {
      // ไม่มีข้อมูลของคลังนี้เลย → ล้างรายการของคลังก่อนหน้าออก (เดิมหัวเป็นคลังใหม่ แต่รายการเป็นของคลังเก่า → เบิกผิดโรงงาน · QA 2026-10-10)
      data = []; filt = [];
      const el = $("mList");
      if (el) el.innerHTML = `<div class="text-center py-14 px-6" role="alert">
          <div class="flex justify-center">${mSign("warn", 40)}</div>
          <p class="font-black mt-2">โหลดรายการของคลังนี้ไม่สำเร็จ</p>
          <p class="m-ink2 text-sm mt-1">${escH(mNetErr(e))}</p>
          <button onclick="loadData._retried=false;loadData()" class="btn-tap m-btn-go mt-4 px-6 py-3">↻ ลองใหม่</button></div>`;
      const sF = $("mSub"); if (sF) sF.textContent = user + " · " + MOD_CFG[mod].sub + " · ยังไม่มีข้อมูล";
    }
    toast("โหลดไม่สำเร็จ: " + mNetErr(e), "err");
  }
}

// ─────────────────────────────────────────────
// LIST RENDER
// ─────────────────────────────────────────────
// ข้อ 10: พิมพ์ค้นหาแล้วรอ 180 มิลลิวินาทีค่อยกรอง — ไม่วาดรายการใหม่ทุกตัวอักษร (ค้นหาจากข้อมูลทั้งหมด แล้วค่อยแบ่งหน้าผล)
let _mFilterTimer = null;
function filterList() {
  clearTimeout(_mFilterTimer);
  _mFilterTimer = setTimeout(_filterListNow, 180);
}
let mListFilter = "all";   // all | no | warn | must | freq — ตรงกับป้ายในแถว (mSignOf) · must = ไม่อัปเดตทั้งหมด
const isLowItem = d => d.min > 0 && d.qty <= d.min;   // นิยามเดียวกับหลังบ้าน (plan.js belowMin) และ rawIsLow ในหน้าคอม
const isExpItem = d => d.expStatus === "expired" || d.expStatus === "near";
// ป้ายหมดอายุบนการ์ด/แผ่นเบิก — คำเดียวกับหน้าคอม
const expTagHtml = d => d.expStatus === "expired"
  ? '<span class="m-red font-black">หมดอายุ' + (d.expDays !== null && d.expDays < 0 ? "แล้ว " + Math.abs(d.expDays) + " วัน" : "") + "</span>"
  : d.expStatus === "near" ? '<span class="m-warn font-black">หมดอายุใน ' + (d.expDays === 0 ? "วันนี้" : d.expDays + " วัน") + "</span>" : "";
// ⏰ ไม่มีการอัปเดตสต๊อกเกินกำหนด — ค่ากลางมากับข้อมูลคลัง (หัวหน้าตั้งที่หน้าคอม)
const mStaleDays = () => Number(mStoreGet("m_staledays_" + mod, 0)) || 0;
const isStaleItem = d => { const n = mStaleDays(); return !!n && d.idle !== undefined && (d.idle === null || d.idle > n); };
// ป้ายของแต่ละรายการ: หมด/หมดอายุ (วงกลมขีดแดง) > ต่ำกว่าจุดสั่งซื้อ/ใกล้หมดอายุ (สามเหลี่ยมเหลือง) > ไม่อัปเดต (วงกลมน้ำเงิน ต้องนับ) > พอ
const mSignOf = d => (d.cr && d.qty <= 0) ? "none" : (d.qty <= 0 || d.expStatus === "expired") ? "no"
  : (isLowItem(d) || d.expStatus === "near" || d.planStatus === "late" || d.planStatus === "now") ? "warn" : isStaleItem(d) ? "must" : "ok";
const M_RANK = { no: 0, warn: 1, must: 2, ok: 3, none: 4 };
function _filterListNow() {
  const q = $("mSearch").value.trim().toLowerCase();
  let list = q ? data.filter(d => d.name.toLowerCase().includes(q) || d.sku.toLowerCase().includes(q)) : [...data];
  // ป้ายแดง/เหลืองขึ้นก่อน — เปิดคลังแล้วเห็นทันทีว่าตัวไหนต้องจัดการ (sort คงลำดับชื่อเดิมในกลุ่มเดียวกัน)
  if (mListFilter === "all") list.sort((a, b) => M_RANK[mSignOf(a)] - M_RANK[mSignOf(b)]);
  else if (mListFilter === "no" || mListFilter === "warn") list = list.filter(d => mSignOf(d) === mListFilter);
  else if (mListFilter === "must") list = list.filter(isStaleItem);
  else if (mListFilter === "freq") {
    const f = mStoreGet("m_freq_" + mod, {});
    list = list.filter(d => f[d.sku] > 0).sort((a, b) => (f[b.sku] - f[a.sku]) || a.name.localeCompare(b.name, "th"));
  }
  filt = list;
  renderChips();
  renderList();
}
function setListFilter(f) {
  mListFilter = f;
  _filterListNow();
  const el = $("mList"); if (el) el.scrollTop = 0;
}
function renderChips() {
  const el = $("mChips");
  if (!el) return;
  const f = mStoreGet("m_freq_" + mod, {});
  const freq = data.filter(d => f[d.sku] > 0).length;
  const nSign = k => data.filter(d => mSignOf(d) === k).length;
  // ชิปตัวกรอง = ป้ายเดียวกับในแถว · ขึ้นเฉพาะกลุ่มที่มีรายการ (หรือกำลังเลือกอยู่) · "ทั้งหมด" ขึ้นเสมอ = ทางกลับ (คลังว่างแล้วกดใช้บ่อย เคยไม่มีทางกลับ · 2026-10-20)
  // ตาราง 3 ช่อง ไม่เลื่อนซ้าย-ขวา (เจ้าของสั่ง 2026-10-20) · คำยาวตัดหลัง "/" เท่านั้น (nowrap กันตัด "หมด|อายุ") · ต้องสั่ง/ใกล้หมดอายุ กว้าง 2 ช่อง
  const nw = t => `<span class="whitespace-nowrap">${t}</span>`;
  const chip = (key, label, cnt, icon, span) => (!cnt && mListFilter !== key && key !== "freq" && key !== "all") ? "" :
    `<button onclick="setListFilter('${key}')" aria-pressed="${mListFilter === key}" class="btn-tap m-chip ${mListFilter === key ? "on" : icon && icon !== "star" ? "hot" : ""} ${span ? "col-span-2" : ""} inline-flex items-center justify-center gap-1 px-1.5 py-1 text-left">${icon === "star" ? '<i class="ic ic-star"></i>' : icon ? mSign(icon, 18) : ""}<span>${label}${cnt ? nw(" " + cnt) : ""}</span></button>`;
  el.innerHTML = chip("all", nw("ทั้งหมด"), data.length)
    + chip("no", "หมด/" + nw("หมดอายุ"), nSign("no"), "no")
    + (mStaleDays() ? chip("must", nw("ไม่อัปเดต"), data.filter(isStaleItem).length, "must") : "")
    + chip("warn", "ต้องสั่ง/" + nw("ใกล้หมดอายุ"), nSign("warn"), "warn", true)
    + chip("freq", nw("ใช้บ่อย"), freq, "star");
}

function populateDropdown() {
  const sel = $("mDropdown");
  sel.innerHTML = '<option value="">เลือกสินค้า / วัตถุดิบ...</option>';
  data.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item.sku;
    const lowTag = (item.min > 0 && item.qty <= item.min) ? " · ต่ำกว่าจุดสั่งซื้อ" : "";
    opt.textContent = item.name + "  ·  " + fmtNum(item.qty) + " " + item.unit + lowTag;
    sel.appendChild(opt);
  });
}

function onDropdownChange() {
  const sku = $("mDropdown").value;
  if (!sku) return;
  $("mDropdown").value = "";   // reset ให้กลับเป็น placeholder
  pickItem(sku);
}

// ข้อ 10: แสดงทีละ 50 รายการ กดแสดงเพิ่มเมื่อต้องการ — เครื่องหน้างานเลื่อนลื่นแม้มีหลายร้อยรายการ
const M_PAGE = 50;
let _mShown = M_PAGE;
function renderList(more) {
  const el = $("mList");
  if (!filt.length) {
    const why = mListFilter === "no" ? "✅ ไม่มีของที่หมดหรือหมดอายุ"
      : mListFilter === "warn" ? "✅ ไม่มีของที่ต้องสั่งหรือใกล้หมดอายุ"
      : mListFilter === "must" ? "✅ ทุกรายการมีการอัปเดตภายใน " + mStaleDays() + " วัน"
      : mListFilter === "freq" ? "ยังไม่มีรายการที่ใช้บ่อย<br><span class=\"text-xs\">ทำรายการแล้วจะขึ้นที่นี่เอง</span>"
      : data.length ? "ไม่พบรายการ" : "ยังไม่มีของคงเหลือในคลังนี้";
    el.innerHTML = mEmptyHtml(why, "py-16");
    return;
  }
  _mShown = more ? _mShown + M_PAGE : M_PAGE;
  const part = filt.slice(0, _mShown);
  el.innerHTML = part.map(item => {

    // บรรทัดสถานะเป็นคำพูด — ป้ายรูปทรงซ้ายเป็นแค่ตัวช่วยกวาดตา
    const meta = [`<span class="m-sku">${escH(item.sku)}</span>`];
    if (item.qty <= 0) meta.push(item.cr ? '<span class="font-black">ยังไม่มีของในคลัง · แตะเพื่อรับเข้า</span>' : '<span class="m-red font-black">หมดแล้ว</span>');
    else if (isLowItem(item)) meta.push('<span class="m-warn font-black">ต่ำกว่าจุดสั่งซื้อ</span>');
    if (item.qty > 0 && /^(late|now|soon)$/.test(item.planStatus)) meta.push(`<span class="font-black" style="color:${planClr(item)}">${escH(item.planText)}</span>`);
    if (isExpItem(item)) meta.push(expTagHtml(item));
    if (isStaleItem(item)) meta.push('<span class="m-must font-black">' + (item.idle === null ? "ไม่เคยบันทึกยอด" : "ไม่อัปเดต " + item.idle + " วัน") + "</span>");
    if (item.daysCover != null) meta.push(`<span class="font-black" style="color:${planClr(item)}">พอ ${fmtNum(item.daysCover)} วัน</span>`);
    return `
    <button onclick="pickItem('${escJA(item.sku)}')" class="item-card m-row">
      ${mSign(mSignOf(item)) || "<span></span>"}
      <span class="min-w-0"><span class="m-name block">${escH(item.name)}</span><span class="m-meta block">${meta.join(" · ")}</span></span>
      <span class="m-qty"><b class="${item.qty <= 0 ? (item.cr ? "m-ink2" : "m-red") : ""}">${fmtNum(item.qty)}</b><span>${escH(item.unit)}</span></span>
    </button>`;
  }).join("") + (filt.length > _mShown
    ? `<button onclick="renderList(true)" class="btn-tap m-btn w-full py-3 mt-1">แสดงเพิ่ม (เหลืออีก ${filt.length - _mShown} รายการ)</button>`
    : "");
}

// ─────────────────────────────────────────────
// ACTION SHEET
// ─────────────────────────────────────────────
function pickItem(sku) {
  sel = data.find(d => d.sku === sku);
  if (!sel) return;
  const cfg = MOD_CFG[mod];

  $("aName").textContent = sel.name;
  // ⛔ ของหมดอายุ/ใกล้หมดอายุ — เห็นก่อนกดเบิก (QA M2)
  $("aSku").innerHTML  = escH(sel.sku + (cfg ? " · " + cfg.sub : "")) + (isExpItem(sel) ? "<br>" + expTagHtml(sel) : "");
  $("aQty").textContent  = fmtNum(sel.qty);
  $("aUnit").textContent = "คงเหลือ (" + sel.unit + ")";
  $("aQtyIn").value = 1;
  if ($("aPurposeIn")) $("aPurposeIn").value = "";   // กันงานของรายการก่อนหน้าติดมา
  renderPurposeChips();

  if (sel.daysCover !== null && sel.daysCover !== undefined) {
    $("aDays").textContent = fmtNum(sel.daysCover);
    $("aDays").style.color = planClr(sel);
    show("aDaysWrap");
  } else { hide("aDaysWrap"); }

  if (sel.min > 0 && sel.qty <= sel.min) show("aWarn"); else hide("aWarn");

  const isViewer = (role || "").toLowerCase() === "viewer";

  if (sel.cr) {
    // Cold Room — lot list + count
    hide("aTypeRow"); hide("aInputRow"); hide("aConfirmRow");
    show("aCrSection");
    if (isViewer) {
      hide("aCrCountRow"); hide("aCrInRow"); hide("aCrConfirmRow");
    }
    crLotSel = null; crAction = null;
    renderCrLots();
  } else {
    if (isViewer) {
      hide("aTypeRow"); hide("aInputRow"); hide("aConfirmRow");
      let vn = $("aViewerNote");
      if (!vn) {
        vn = document.createElement("p");
        vn.id = "aViewerNote";
        vn.className = "text-center m-ink2 font-bold text-sm py-4";
        vn.textContent = "สิทธิ์ดูอย่างเดียว — ไม่สามารถเบิก/รับ/นับได้";
        $("aTypeRow").parentNode.insertBefore(vn, $("aTypeRow"));
      }
      show("aViewerNote");
    } else {
      hide("aViewerNote");
      show("aTypeRow"); show("aInputRow"); show("aConfirmRow");
    }
    hide("aCrSection");
    if (!isViewer) setType("OUT");
  }

  show("actionOverlay");
  mArmBack();          // ปุ่มย้อนกลับของเครื่อง = ปิดแผ่นนี้ (ไม่ออกจากแอป)
  mFillWorkOrders();   // ข้อ 19: เติมใบสั่งผลิตให้เลือกตอนเบิก (ไม่บังคับ)
  requestAnimationFrame(() => {
    requestAnimationFrame(() => $("actionSheet").classList.add("open"));
  });
}

// ─────────────────────────────────────────────
// COLD ROOM — LOT COUNT
// ─────────────────────────────────────────────
let crLotSel = null;   // lot ที่เลือก
let crAction  = null;  // "count" | "out" | "in"

function fmtDate(iso) {
  if (!iso) return "-";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y ? y.slice(2) : ""}`;
}
function isoToDdmmyy(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return d + m + (y ? y.slice(2) : "");
}
function expColor(status) {
  if (status === "หมดอายุ")     return "#c8102e";
  if (status === "ใกล้หมดอายุ") return "#8a5a00";
  return "#006b31";
}

function _hideCrInputs() {
  hide("aCrCountRow"); hide("aCrInRow"); hide("aCrConfirmRow");
}

function renderCrLots() {
  if (!sel || !sel.lots) return;
  const el = $("aCrLots");
  if (!sel.lots.length) {
    el.innerHTML = '<p class="m-ink2 text-sm text-center py-4">ไม่มี Lot ที่มียอดคงเหลือ</p>';
    return;
  }
  el.innerHTML = sel.lots.map((lot, i) => {
    const col = expColor(lot.expStatus);
    const sign = lot.expStatus === "หมดอายุ" ? "no" : lot.expStatus === "ใกล้หมดอายุ" ? "warn" : lot.stale ? "must" : "ok";
    const daysLabel = lot.expDays < 0
      ? `<span style="color:${col}">หมดอายุ ${Math.abs(lot.expDays)} วันแล้ว</span>`
      : `<span style="color:${col}">${lot.expStatus === "ใกล้หมดอายุ" ? "ใกล้หมดอายุ · " : ""}เหลือ ${lot.expDays} วัน</span>`
        + (i === 0 && sel.lots.length > 1 ? ' <span class="m-go font-black">· เบิกล็อตนี้ก่อน</span>' : "");
    return `
    <div class="m-panel p-3">
      <div class="flex items-start gap-2.5">
        ${mSign(sign, 28)}
        <div class="flex-1 min-w-0 text-sm">
          <div class="m-ink2">MFG <span class="font-black" style="color:var(--m-ink)">${fmtDate(lot.mfg)}</span>
            · EXP <span class="font-black" style="color:var(--m-ink)">${fmtDate(lot.exp)}</span></div>
          <div class="mt-0.5 font-bold">${daysLabel}</div>
          ${lot.stale ? '<div class="mt-0.5 font-black m-must">' + (lot.idle === null ? "ไม่เคยบันทึกยอด" : "ไม่อัปเดต " + lot.idle + " วัน") + ' — ช่วยนับยืนยัน</div>' : ""}
          <div class="mt-1"><span class="m-k text-2xl">${fmtNum(lot.qty)}</span> <span class="m-ink2 text-xs font-bold">${escH(lot.unit)}</span></div>
        </div>
        ${(role||"").toLowerCase() === "viewer" ? "" : `<div class="flex flex-col gap-2 flex-shrink-0">
          <button onclick="crSelectLot(${i},'out')"
            class="btn-tap t-out text-white px-4 py-3 rounded-md font-black text-sm" style="min-width:88px;min-height:44px;"><i class="ic ic-out"></i> เบิก</button>
          <button onclick="crSelectLot(${i},'count')"
            class="btn-tap t-cnt text-white px-4 py-3 rounded-md font-black text-sm" style="min-width:88px;min-height:44px;"><i class="ic ic-count"></i> นับ</button>
        </div>`}
      </div>
    </div>`;
  }).join("");
}

function crSelectLot(i, action) {
  crLotSel = sel.lots[i];
  crAction  = action;
  _hideCrInputs();
  hide("aCrInRow");

  const isOut   = action === "out";
  const labelColor = isOut ? "text-orange-700" : "text-cyan-700";
  const prefix  = isOut ? "เบิกจาก" : "นับสต๊อก";

  $("aCrLotLabel").className = `${labelColor} text-sm text-center font-black mb-2`;
  $("aCrLotLabel").textContent =
    `${prefix} · MFG ${fmtDate(crLotSel.mfg)} · ปัจจุบัน ${crLotSel.qty} ${crLotSel.unit}`;
  // นับ = เว้นว่างให้พิมพ์ยอดที่นับได้จริง (ไม่เติมยอดในระบบไว้ล่วงหน้า)
  $("aCrQtyIn").value = isOut ? 1 : "";
  $("aCrQtyIn").placeholder = isOut ? "" : "ยอดที่นับได้";

  const confirmBtn = $("aCrConfirm");
  confirmBtn.className = `btn-tap m-confirm icb w-full ${isOut ? "t-out" : "t-cnt"}`;
  confirmBtn.textContent = isOut ? "ยืนยันการเบิก" : "บันทึกการนับ";

  if ($("aCrNote")) $("aCrNote").value = "";
  show("aCrCountRow"); show("aCrConfirmRow");
  crPreview();
  $("aCrQtyIn").focus();
}

// รหัสกันส่งซ้ำ — รับเข้า/เบิกเป็นการบวก/ลบ ถ้าคำขอเดียวกันถูกส่งซ้ำ หลังบ้านต้องรู้ว่าเป็นอันเดิม
const mOpId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "m-" + Date.now() + "-" + Math.random().toString(36).slice(2);
// ทวนตัวเลขก่อนกด: รับเข้า (บวกเข้าล็อตเดิม/ล็อตใหม่) · นับ (ต่างจากระบบเท่าไร) · เบิก (เหลือเท่าไร)
function crPreview() {
  if (!sel) return;
  const u = sel.unit || "", btn = $("aCrConfirm");
  if (crAction === "in") {
    const q = numVal($("aCrQtyIn2").value), mfg = $("aCrMfg").value;
    const lot = (sel.lots || []).find(l => String(l.mfg).slice(0, 10) === mfg);
    $("aCrInHint").textContent = !mfg ? "" : lot
      ? "มีล็อตวันผลิตนี้อยู่ " + fmtNum(lot.qty) + " → รับเข้าแล้วรวม " + (isNaN(q) ? "?" : fmtNum(lot.qty + q)) + " " + u
      : "ล็อตใหม่";
    btn.textContent = "บันทึกรับเข้า" + (isNaN(q) ? "" : " " + fmtNum(q) + " " + u);
    return;
  }
  if (!crLotSel) return;
  const el = $("aCrDiff"), rawQ = String($("aCrQtyIn").value).trim(), q = numVal(rawQ), have = Number(crLotSel.qty) || 0;
  let txt = "", cls = "m-ink2";
  if (rawQ === "" || isNaN(q)) btn.textContent = crAction === "out" ? "ยืนยันการเบิก" : "บันทึกการนับ";
  else if (crAction === "out") {
    if (q > have) { txt = "เกินยอดล็อต (มี " + fmtNum(have) + " " + u + ")"; cls = "m-red"; }
    else txt = "เบิกแล้วล็อตนี้เหลือ " + fmtNum(have - q) + " " + u;
    btn.textContent = "ยืนยันเบิก " + fmtNum(q) + " " + u;
  } else {
    const d = Math.round((q - have) * 1000) / 1000;
    txt = "ในระบบ " + fmtNum(have) + " → นับได้ " + fmtNum(q) + " " + u + (d ? " (" + (d > 0 ? "+" : "−") + fmtNum(Math.abs(d)) + ")" : " (ตรงกับระบบ)");
    if (d) cls = "m-warn";
    btn.textContent = "บันทึกยอดนับ " + fmtNum(q) + " " + u;
  }
  el.textContent = txt;
  el.className = "text-sm text-center font-black mt-2 " + cls;
}

function crCalcExp() {
  const mfgVal = $("aCrMfg").value;
  if (!mfgVal || !sel) return;
  const shelf = sel.shelfDays || 0;
  if (shelf <= 0) return;
  const exp = new Date(mfgVal);
  exp.setDate(exp.getDate() + shelf);
  $("aCrExp").value = exp.toISOString().split("T")[0];
  $("aCrExpHint").textContent = `คำนวณอัตโนมัติ (+${shelf} วัน)`;
}

function crOpenNewLot() {
  crLotSel = null;
  crAction  = "in";
  _hideCrInputs();

  const today = new Date();
  // วันตามเวลาเครื่อง (ไทย) — toISOString เป็น UTC ก่อน 7 โมงเช้าได้วันของเมื่อวาน (กับดักข้อ 5)
  const toISO = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  $("aCrMfg").value = toISO(today);
  $("aCrQtyIn2").value = 1;

  // Auto-calc EXP จาก shelf life
  const shelf = sel ? sel.shelfDays : 0;
  if (shelf > 0) {
    const exp = new Date(today);
    exp.setDate(exp.getDate() + shelf);
    $("aCrExp").value = toISO(exp);
    $("aCrExpHint").textContent = `คำนวณอัตโนมัติ (+${shelf} วัน)`;
  } else {
    $("aCrExp").value = "";
    $("aCrExpHint").textContent = "ระบุเอง (ไม่มีข้อมูลอายุมาตรฐาน)";
  }

  const confirmBtn = $("aCrConfirm");
  confirmBtn.className = "btn-tap m-confirm icb w-full t-in";
  confirmBtn.textContent = "บันทึกรับเข้า";

  show("aCrInRow"); show("aCrConfirmRow");
  crPreview();
}

function adjCrQty(d) {
  const el = crAction === "in" ? $("aCrQtyIn2") : $("aCrQtyIn");
  const min = crAction === "count" ? 0 : 1;
  const cur = numVal(el.value);
  el.value = Math.max(min, (isNaN(cur) ? (crAction === "count" ? 0 : min) : cur) + d);
  crPreview();
}

async function confirmCrCount() {
  if (!sel) return;
  const btn = $("aCrConfirm");

  let payload, loadMsg, successMsg;

  if (crAction === "in") {
    const mfgIso = $("aCrMfg").value;
    const expIso = $("aCrExp").value;
    const qty    = numVal($("aCrQtyIn2").value);
    if (!mfgIso || !expIso) { toast("กรุณาระบุ MFG และ EXP", "warn"); return; }
    if (!(qty > 0))          { toast("ระบุจำนวนมากกว่า 0", "warn"); return; }
    if (mfgIso > expIso)     { toast("MFG ต้องไม่เกิน EXP", "warn"); return; }
    payload = { barcode: sel.sku, employeeName: user,
                mfg: isoToDdmmyy(mfgIso), exp: isoToDdmmyy(expIso),
                newQty: qty, note: "รับเข้า (Mobile)", mode: "add", opId: mOpId() };   // บวกเพิ่มเข้าล็อตวันผลิตเดียวกัน (เดิมทับยอด)
    loadMsg   = "กำลังบันทึกรับเข้า...";
    successMsg = `📥 รับเข้า ${qty} ${sel.unit || ""} · MFG ${fmtDate(mfgIso)}`;

  } else {
    if (!crLotSel) return;
    // numVal: ช่องว่างได้ NaN (Number("") ได้ 0 → เคยกดบันทึกเปล่าแล้วกลายเป็นนับได้ 0)
    let newQty = numVal($("aCrQtyIn").value);
    if (String($("aCrQtyIn").value).trim() === "") { toast(crAction === "out" ? "ระบุจำนวนที่เบิก" : "พิมพ์ยอดที่นับได้จริงก่อนบันทึก (ของหมดให้ใส่ 0)", "warn"); $("aCrQtyIn").focus(); return; }
    if (isNaN(newQty) || newQty < 0) { toast("ระบุจำนวนให้ถูกต้อง", "warn"); return; }
    const crNote = ($("aCrNote")?.value || "").trim();
    if (!crNote) { toast("กรุณาระบุหมายเหตุก่อนบันทึก", "warn"); $("aCrNote")?.focus(); return; }
    const isOut = crAction === "out";
    if (isOut) {
      if (!(newQty > 0)) { toast("ระบุจำนวนที่เบิกมากกว่า 0", "warn"); return; }
      if (newQty > crLotSel.qty) { toast(`⚠️ เบิกเกินยอด Lot (มี ${crLotSel.qty})`, "err"); return; }
    }
    // เบิก: ส่ง "จำนวนที่เบิก" ให้หลังบ้านลดเอง + ตรวจยอดพอใน SQL (เดิมคิดยอดเหลือที่เครื่อง → สองเครื่องทำพร้อมกันยอดเพี้ยน)
    payload = { barcode: sel.sku, employeeName: user,
                mfg: isoToDdmmyy(crLotSel.mfg), exp: isoToDdmmyy(crLotSel.exp),
                newQty, note: crNote, ...(isOut ? { mode: "sub", opId: mOpId() } : {}) };
    if (isOut) newQty = crLotSel.qty - newQty;   // ไว้แสดงผลหลังบันทึก
    loadMsg   = crAction === "out" ? "กำลังบันทึกการเบิก..." : "กำลังบันทึกการนับ...";
    successMsg = crAction === "out"
      ? `📤 เบิก · ${sel.name} Lot ${fmtDate(crLotSel.mfg)} → เหลือ ${newQty} ${crLotSel.unit}`
      : `📊 นับแล้ว · ${sel.name} Lot ${fmtDate(crLotSel.mfg)} = ${newQty} ${crLotSel.unit}`;
  }

  const btnLabel = btn.textContent;
  btn.disabled = true; btn.textContent = "กำลังบันทึก...";
  setLoading(true, loadMsg);
  try {
    const r = await gasPost({ module: "COLDROOM", action: "saveOrUpdateCount", payload });
    setLoading(false); btn.disabled = false;
    if (r.ok) {
      toast(`✅ ${successMsg}`);
      closeAction();
      tgFlushSoon();
      loadData({ silent: true });   // ข้อ 2: ไม่บังจอ ดึงใหม่เบื้องหลัง
    } else { btn.textContent = btnLabel; toast(r.message || "บันทึกไม่สำเร็จ", "err"); }
  } catch(e) {
    setLoading(false); btn.disabled = false; btn.textContent = btnLabel;
    toast("เกิดข้อผิดพลาด: " + e.message, "err");
  }
}

function closeAction() {
  $("actionSheet").classList.remove("open");
  // คืนเพดานเดิม ห้ามล้างเป็น "" — ล้างแล้วแผ่นที่เปิดครั้งถัดไปไม่มีเพดาน ปุ่ม ✕ หลุดขอบจอบน (QA S6 2026-10-10)
  $("actionSheet").style.maxHeight = (window.CSS && CSS.supports && CSS.supports("max-height", "85dvh")) ? "85dvh" : "85vh";
  setTimeout(() => hide("actionOverlay"), 300);
}

// ตัวอักษรใหญ่ (ตั้งขนาดตัวอักษรในเครื่อง/ซูม) — ส่วนหัว + ช่องค้นหา + ตัวกรอง สูงเกินครึ่งจอ ให้ทั้งหน้าเลื่อนรวมกัน
// (เดิมขยาย 200% แล้วรายการเริ่มใต้แถบเมนูล่าง มองไม่เห็นเลย · QA M9 2026-10-10)
function mFitHeader() {
  const main = $("sMain"), list = $("mList");
  if (!main || !list || !_mVisible("sMain")) return;
  main.classList.remove("m-scroll-all");
  const headH = list.getBoundingClientRect().top - main.getBoundingClientRect().top;
  main.classList.toggle("m-scroll-all", headH > window.innerHeight * 0.45);
}
window.addEventListener("resize", () => { clearTimeout(mFitHeader._t); mFitHeader._t = setTimeout(mFitHeader, 150); });

// ปุ่ม "📋 สต๊อก" ที่แถบล่าง — เดิมไม่มีคำสั่ง กดแล้วไม่เกิดอะไร · ตอนนี้ = ปิดแผ่นที่เปิดอยู่ + เลื่อนรายการกลับบนสุด
function mGoList() {
  for (const [id, fn] of [["planSheet", closePlan], ["myHistSheet", closeMyHistory], ["shareSheet", closeShareApp]]) if (_mVisible(id)) fn();
  if (_mVisible("actionOverlay")) closeAction();
  const el = $("mList"); if (el) el.scrollTo({ top: 0, behavior: "smooth" });
}

// ── ปุ่มย้อนกลับของเครื่อง / ปุ่ม Esc (QA S7 + M7 2026-10-10) ──
// เดิมกด back แล้วไป "/" ซึ่งเด้งกลับมาที่นี่ (วนไม่จบ) และตัวเลขที่กรอกค้างหาย
// วิธี: ตอนอยู่ในคลังหรือเปิดแผ่นอยู่ มีประวัติกันไว้ 1 ชั้น → back = ปิดแผ่นบนสุด หรือกลับหน้าเลือกคลัง
let _mTrap = false;
function mArmBack() {
  if (_mTrap) return;
  try { history.pushState({ mTrap: 1 }, ""); _mTrap = true; } catch (e) {}
}
const _mVisible = (id) => { const el = $(id); return !!el && !el.classList.contains("hidden") && el.style.display !== "none"; };
function _mTopLayerClose() {
  if (_mVisible("sScanner")) { closeScanner(); return true; }
  if (_mVisible("actionOverlay")) { closeAction(); return true; }
  for (const [id, fn] of [["planSheet", closePlan], ["myHistSheet", closeMyHistory], ["shareSheet", closeShareApp]])
    if (_mVisible(id)) { fn(); return true; }
  if (_mVisible("sMain")) { goModuleSelect(); return true; }
  return false;
}
const _mInsideApp = () => ["sScanner", "actionOverlay", "planSheet", "myHistSheet", "shareSheet", "sMain"].some(_mVisible);
window.addEventListener("popstate", () => {
  _mTrap = false;
  _mTopLayerClose();
  if (_mInsideApp()) mArmBack();   // ยังมีชั้นให้ถอยต่อ
});
// คีย์บอร์ด (แท็บเล็ต/คอมที่เปิดหน้ามือถือ): Esc = ปิดแผ่นบนสุด (ไม่ถอยออกจากคลัง)
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.isComposing) return;
  if (_mVisible("sScanner") || _mVisible("actionOverlay") || ["planSheet", "myHistSheet", "shareSheet"].some(_mVisible)) { e.preventDefault(); _mTopLayerClose(); }
});

// ── ปรับความสูง action sheet เมื่อ keyboard เปิด/ปิด ──
function _adjustSheet() {
  if ($("actionOverlay").classList.contains("hidden")) return;
  const vvh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  $("actionSheet").style.maxHeight = Math.round(vvh * 0.92) + "px";
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", _adjustSheet);
}

function setType(t) {
  aType = t;
  // สีประจำงาน (t-*) ชุดเดียวกับปุ่มยืนยัน — เลือกแล้วปุ่มทึบสี ที่ไม่ได้เลือกเป็นแผ่นขาว
  const TCLS = { OUT: "t-out", RETURN: "t-ret", IN: "t-in", COUNT: "t-cnt" };
  [["aBtnOut", "OUT"], ["aBtnReturn", "RETURN"], ["aBtnIn", "IN"], ["aBtnCount", "COUNT"]].forEach(([id, k]) => {
    $(id).className = t === k ? "m-type on " + TCLS[k] : "m-type";
    $(id).setAttribute("aria-pressed", t === k);
  });

  // ช่อง "ใช้กับงาน" — บังคับเฉพาะเบิกออก / ตอนนับสต๊อกไม่ต้องใช้เลย
  const _pw = $("aPurposeWrap"), _pr = $("aPurposeReq"), _pi = $("aPurposeIn");
  if (_pw) _pw.style.display = (t === "COUNT") ? "none" : "";
  if (_pr) _pr.style.display = (t === "OUT") ? "" : "none";
  if (_pi) _pi.placeholder = (t === "OUT")
    ? "เช่น ผลิตวุ้นมะพร้าว ล็อต 3"
    : "ระบุหรือไม่ก็ได้";

  // ปุ่มยืนยันสีเดียวกับประเภทที่เลือก — มองปุ่มก็รู้ว่ากำลังจะเบิกหรือรับ
  const confirmBtn = $("aConfirm");
  confirmBtn.className = "btn-tap m-confirm icb w-full " + (TCLS[t] || "t-in");
  // นับ = เว้นว่างให้พิมพ์ยอดที่นับได้จริง (เดิมเติมยอดในระบบไว้ → กดบันทึกได้ทั้งที่ไม่ได้นับ) · อื่นๆ = 1
  $("aQtyIn").value = (t === "COUNT") ? "" : 1;
  $("aQtyIn").dataset.touched = "";
  $("aQtyIn").inputMode = "decimal";
  $("aQtyIn").placeholder = (t === "COUNT") ? "ยอดที่นับได้" : "";
  renderQuick();
  updateAfter();
}

// ข้อความบนปุ่มยืนยัน — บอกทั้งประเภทและจำนวน ("เบิก 500 ใบ" · ไอคอนวาดจาก CSS icb) ให้อ่านทวนก่อนกด
function confirmLabel() {
  const q = numVal($("aQtyIn").value), u = sel ? (sel.unit || "") : "";
  const n = isNaN(q) ? "" : " " + fmtNum(q) + " " + u;
  return ({ OUT: "เบิก", RETURN: "คืน", IN: "รับเข้า", COUNT: "บันทึกยอดนับ" }[aType] || "ยืนยัน") + n;
}

// ยอดหลังบันทึก — เห็นก่อนกดยืนยัน
function updateAfter() {
  const el = $("aAfter");
  if (!el || !sel || sel.cr) return;
  const q = numVal($("aQtyIn").value), u = sel.unit || "";
  const btn = $("aConfirm");
  if (btn && !btn.disabled) btn.textContent = confirmLabel();
  if (isNaN(q) || q < 0) {
    el.className = "flex-1 text-center text-sm font-black m-ink2";
    el.textContent = (aType === "COUNT" && String($("aQtyIn").value).trim() === "") ? "พิมพ์ยอดที่นับได้จริง" : "";
    return;
  }
  const expr = /[-+*\/x×÷()]/i.test(String($("aQtyIn").value)) ? "= " + fmtNum(q) + " " + u + " · " : "";
  let txt, cls = "m-ink2";
  if (aType === "COUNT") {
    const diff = Math.round((q - sel.qty) * 1000) / 1000;
    txt = expr + (diff === 0 ? "ตรงกับยอดในระบบ" : "ต่างจากระบบ " + (diff > 0 ? "+" : "−") + fmtNum(Math.abs(diff)) + " " + u);
    if (diff !== 0) cls = "m-warn";
  } else {
    const after = Math.round((aType === "OUT" ? sel.qty - q : sel.qty + q) * 1000) / 1000;
    if (after < 0) { txt = "เกินยอดที่มี (" + fmtNum(sel.qty) + " " + u + ")"; cls = "m-red"; }
    else {
      txt = expr + "จะเหลือ " + fmtNum(after) + " " + u;
      if (after === 0) { txt += " (หมดพอดี)"; cls = "m-warn"; }
      else if (aType === "OUT" && sel.min > 0 && after <= sel.min) { txt += " · ต่ำกว่าจุดสั่งซื้อ"; cls = "m-warn"; }
    }
  }
  el.className = "flex-1 text-center text-sm font-black " + cls;
  el.textContent = txt;
}

// ปุ่มบวกเร็ว — ขนาดก้าวตามยอดของตัวนั้น
function quickSteps() {
  const q = sel ? Math.abs(sel.qty) : 0;
  if (q >= 50000) return [100, 1000, 10000];
  if (q >= 1000)  return [10, 100, 1000];
  if (q >= 100)   return [5, 10, 100];
  return [1, 5, 10];
}
function renderQuick() {
  const el = $("aQuick");
  if (!el) return;
  const b = "btn-tap m-btn flex-1 py-2 text-sm";
  let html = quickSteps().map(n => `<button onclick="addQty(${n})" class="${b}">+${fmtNum(n)}</button>`).join("");
  if (aType === "OUT" && sel && sel.qty > 0) html += `<button onclick="setQty(${Number(sel.qty)})" class="${b} text-orange-700">ทั้งหมด</button>`;
  // นับแล้วตรงกับในระบบ — ต้องแตะเองทุกครั้ง (ไม่เติมให้ล่วงหน้า) ไม่ต้องพิมพ์ตัวเลขยาวๆ ซ้ำ
  if (aType === "COUNT" && sel) html += `<button onclick="setQty(${Number(sel.qty) || 0})" class="${b} text-cyan-700">✓ ตรงกับระบบ</button>`;
  el.innerHTML = html;
}
function calcMode() {
  const el = $("aQtyIn");
  el.inputMode = "text";
  el.value = "";
  el.placeholder = "16*48+5";
  el.dataset.touched = "1";
  updateAfter();
  el.focus();
}
function setQty(v) {
  const el = $("aQtyIn");
  el.value = v === "" ? "" : v;
  updateAfter();
  if (v === "") el.focus();
}
// กดบวกครั้งแรกขณะยังเป็นค่าตั้งต้น 1 → แทนที่ (ตั้งใจจะได้ 100 ไม่ใช่ 101)
function addQty(n) {
  const el = $("aQtyIn"), cur = numVal(el.value);
  const fresh = isNaN(cur) || (aType !== "COUNT" && cur === 1 && !el.dataset.touched);   // ช่องนับว่าง = เริ่มจาก 0
  el.value = Math.round(((fresh ? 0 : cur) + n) * 1000) / 1000;
  el.dataset.touched = "1";
  updateAfter();
}

function adjQty(d) {
  const el = $("aQtyIn");
  const min = aType === "COUNT" ? 0 : 1;
  const cur = numVal(el.value);
  el.value = Math.max(min, Math.round(((isNaN(cur) ? min : cur) + d) * 1000) / 1000);
  el.dataset.touched = "1";
  updateAfter();
}

// งานที่เบิกบ่อย — ของเครื่องนี้ก่อน แล้วตามด้วยของคนอื่นในคลังเดียวกัน
function renderPurposeChips() {
  const el = $("aPurposeChips");
  if (!el) return;
  const mine = mStoreGet("m_purposes_" + mod, []), srv = mStoreGet("m_purposes_srv_" + mod, []);
  const list = [...mine, ...srv.filter(p => mine.indexOf(p) < 0)].slice(0, 8);
  el.innerHTML = list.map(p =>
    `<button onclick="pickPurpose(this)" data-p="${escH(p)}" class="btn-tap m-chip px-3">${escH(p.length > 26 ? p.slice(0, 25) + "…" : p)}</button>`).join("");
  const dl = $("aPurposeList");
  if (dl) dl.innerHTML = list.map(p => `<option value="${escH(p)}">`).join("");
}
function pickPurpose(btn) { $("aPurposeIn").value = btn.getAttribute("data-p") || ""; }

async function confirmAction() {
  if (!sel) return;
  const qty = numVal($("aQtyIn").value);
  if (aType === "COUNT" && String($("aQtyIn").value).trim() === "") { toast("พิมพ์ยอดที่นับได้จริงก่อนบันทึก (ของหมดให้ใส่ 0)", "warn"); $("aQtyIn").focus(); return; }
  if (isNaN(qty) || qty < 0) { toast("ระบุจำนวนให้ถูกต้อง", "warn"); $("aQtyIn").focus(); return; }
  if (aType !== "COUNT" && qty <= 0) { toast("ระบุจำนวนมากกว่า 0", "warn"); return; }
  if (aType === "OUT" && qty > sel.qty) {
    toast(`⚠️ สต๊อกไม่พอ — มี ${fmtNum(sel.qty)} ${sel.unit}`, "err"); return;
  }
  const btn = $("aConfirm");
  btn.disabled = true; btn.textContent = "กำลังบันทึก...";

  const isCount = aType === "COUNT";
  // เบิกออกต้องระบุว่าเอาไปใช้กับงานอะไร — ข้อมูลนี้ต้องขึ้นใบเบิกให้ออดิเตอร์ตรวจ
  if (aType === "OUT" && !($("aPurposeIn").value || "").trim()) {
    toast("กรุณาระบุว่าเบิกไปใช้กับงานอะไร", "warn");
    $("aPurposeIn").focus();
    btn.disabled = false; btn.textContent = confirmLabel();
    return;
  }
  const BUSY  = { COUNT:"กำลังบันทึกการนับ...", OUT:"กำลังบันทึกการเบิก...", RETURN:"กำลังบันทึกการคืน...", IN:"กำลังบันทึกรับเข้า..." };
  setLoading(true, BUSY[aType] || "กำลังบันทึก...");
  try {
    const LB = { COUNT:"นับ", OUT:"เบิก", RETURN:"คืน", IN:"รับ" };
    const label = `${LB[aType]||aType} ${sel.name} ${qty} ${sel.unit||""}`.trim();
    // ผ่านคิวออฟไลน์ — ออนไลน์ยิงตรงเหมือนเดิม เน็ตล่มเก็บไว้ส่งเองทีหลัง
    const r = isCount
      ? await offlineSend({ module: mod, action: "VERIFY", sku: sel.sku, qty, user }, label)
      : await offlineSend({ module: mod, action: "UPDATE", sku: sel.sku, type: aType, qty,
                        purpose: ($("aPurposeIn").value || "").trim(),
                        workOrderId: ($("aWorkOrder")?.value || "").trim(), user }, label);

    setLoading(false); btn.disabled = false;
    btn.textContent = confirmLabel();
    // ส่งถึงเซิร์ฟเวอร์หรือเก็บเข้าคิวแล้ว = งานของพนักงานเสร็จ → จำไว้ให้ครั้งหน้าแตะเลือกได้
    if (!r.storeFailed && (r.queued || r.status === "success")) {
      mBumpPick(sel.sku);
      if (aType === "OUT") mRememberPurpose($("aPurposeIn").value);
    }

    // ข้อ 2: เน็ตล่มและเก็บลงเครื่องไม่ได้ — ต้องบอกตรงๆ ไม่ปิดแผง ให้พนักงานจดไว้
    if (r.storeFailed) {
      alert("เน็ตล่ม และเก็บรายการไว้ในเครื่องไม่ได้\n(พื้นที่เต็มหรือเบราว์เซอร์ไม่อนุญาต)\n\nกรุณาจดไว้: " + label + "\nแล้วบันทึกใหม่เมื่อเน็ตกลับมา");
      return;
    }
    if (r.needLogin) { if (r.queued) closeAction(); mNeedLogin(r); return; }
    // เน็ตล่ม → เก็บไว้ในเครื่องแล้ว ถือว่างานของพนักงานเสร็จ ปิดแผงได้เลย
    if (r.queued) {
      toast("📴 เน็ตล่ม — บันทึกไว้ในเครื่องแล้ว ส่งให้เองเมื่อเน็ตกลับมา", "warn");
      closeAction();
      mUpdateOfflineBar();
      return;
    }

    const ok = isCount ? r.status === "success" : r.status === "success";
    if (ok) {
      const LABEL = { COUNT:`นับ → ${fmtNum(qty)}`, OUT:`เบิก ${fmtNum(qty)}`, RETURN:`คืน ${fmtNum(qty)}`, IN:`รับ ${fmtNum(qty)}` };
      const label = LABEL[aType] || `${qty}`;
      toast(`${label} ${sel.unit} · ${sel.name}`);
      closeAction();
      // ข้อ 2: ยอดใหม่ที่เซิร์ฟเวอร์ยืนยันแล้ว → ปรับรายการบนจอทันที ไม่ต้องรอโหลดทั้งคลัง (ดึงใหม่เบื้องหลังตามหลัง)
      const newQty = isCount ? Number(r.applied) : (r.slip && r.slip.balance != null ? Number(r.slip.balance) : NaN);
      const it = data.find(d => d.sku === sel.sku);
      if (it && !isNaN(newQty)) { it.qty = newQty; it.idle = 0; populateDropdown(); _filterListNow(); }
      tgFlushSoon();
      loadData({ silent: true });
    } else { toast(r.message || "บันทึกไม่สำเร็จ", "err"); }
  } catch(e) {
    setLoading(false); btn.disabled = false;
    btn.textContent = confirmLabel();
    toast("เกิดข้อผิดพลาด: " + e.message, "err");
  }
}

// ─────────────────────────────────────────────
// 📈 ต้องสั่ง — วัตถุดิบตัวไหนจะหมดก่อนของมาถึง
// ตัวเลขทั้งหมดคิดที่หลังบ้าน (action USAGEPLAN) — ที่นี่แค่แสดงผล จึงตรงกับหน้าคอมเสมอ
// ─────────────────────────────────────────────
let planData = null, planFilter = "todo", _planSeq = 0;
// สถานะ → สีตัวหนังสือ (ผ่าน 4.5:1 บนพื้นขาว) · ป้ายรูปทรง (ป้ายบอกความรุนแรงอย่างเดียว ไม่มีกรอบสี)
const PLAN_TONE = {
  late:   { text: "m-red",           sign: "no" },
  now:    { text: "text-orange-700", sign: "warn" },
  soon:   { text: "m-warn",          sign: "warn" },
  ok:     { text: "m-go",            sign: "ok" },
  nodata: { text: "m-ink2",          sign: "" }
};
const thDate = iso => { const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + "/" + m[2] + "/" + String(Number(m[1]) + 543).slice(2) : "—"; };

function planSetBadge(r) {
  const b = $("navPlanBadge");
  if (!b) return;
  const n = r && r.summary ? r.summary.late + r.summary.now : 0;
  b.textContent = n > 99 ? "99+" : String(n);
  b.classList.toggle("hidden", !n);
}
async function planFetch() {
  const m0 = mod;
  const r = await gasPost({ module: m0, action: "USAGEPLAN" });
  if (!r || r.status !== "success") throw new Error((r && r.message) || "โหลดไม่สำเร็จ");
  if (m0 !== mod) return null;
  planData = r;
  planSetBadge(r);
  return r;
}
async function planRefreshBadge() {
  if (mod !== "SQF" && mod !== "MLM") return;
  const seq = ++_planSeq;
  try { await planFetch(); if (seq === _planSeq && !$("planSheet").classList.contains("hidden")) renderPlan(); } catch (e) { /* ออฟไลน์ — ป้ายคงเดิม */ }
}

async function openPlan() {
  if (mod !== "SQF" && mod !== "MLM") return;
  $("planSheet").classList.remove("hidden");
  mArmBack();
  $("planSub").textContent = MOD_CFG[mod].title;
  planFilter = "todo";
  if (planData && planData.module === mod) renderPlan();
  else { $("planTiles").innerHTML = ""; $("planList").innerHTML = '<p class="m-ink2 text-center py-10 font-bold">กำลังอ่านประวัติการเบิก...</p>'; }
  try { if (await planFetch()) renderPlan(); }
  catch (e) {
    if (!planData || planData.module !== mod)
      $("planList").innerHTML = '<div class="text-center py-10" role="alert"><div class="flex justify-center">' + mSign("warn", 40) + '</div><p class="font-black mt-2">โหลดไม่สำเร็จ</p><p class="text-sm m-ink2 mt-1">' + escH(mNetErr(e)) + '</p>' +
        '<button onclick="openPlan()" class="btn-tap m-btn-go mt-4 px-6 py-3">↻ ลองใหม่</button></div>';
    else toast("ตรวจข้อมูลล่าสุดไม่ได้ — แสดงของเดิม", "warn");
  }
}
function closePlan() { $("planSheet").classList.add("hidden"); }
function planSetFilter(f) { planFilter = f; renderPlan(); $("planList").scrollTop = 0; }
function planRows() {
  const items = (planData && planData.items) || [];
  if (planFilter === "all") return items;
  if (planFilter === "todo") return items.filter(x => x.status === "late" || x.status === "now" || x.status === "soon");
  if (planFilter === "stale") return items.filter(x => x.stale);
  return items.filter(x => x.status === planFilter);
}
const planOrderList = () => ((planData && planData.items) || []).filter(x => (x.status === "late" || x.status === "now") && x.suggestQty > 0);

function renderPlan() {
  if (!planData) return;
  const sum = planData.summary, S = planData.settings;
  $("planSub").textContent = MOD_CFG[mod].title + " · รอของ " + S.leadDays + " วัน + กันชน " + S.safetyDays + " วัน";
  const todo = sum.late + sum.now + sum.soon;
  const tile = (key, label, n, tone, sign) => {
    const on = planFilter === key;
    return `<button onclick="planSetFilter('${key}')" aria-pressed="${on}" class="btn-tap m-tile ${on ? "on" : ""} px-1 py-2 text-center">
      <div class="flex items-center justify-center gap-1">${sign ? mSign(sign, 16) : ""}<span class="m-k text-2xl leading-tight ${tone}">${n}</span></div>
      <div class="text-xs font-bold m-ink2 mt-0.5 leading-tight">${label}</div></button>`;
  };
  $("planTiles").innerHTML =
      tile("todo", "ต้องลงมือ", todo, todo ? "" : "m-ink2")
    + tile("late", "สั่งไม่ทันแล้ว", sum.late, sum.late ? "m-red" : "m-ink2", "no")
    + tile("now",  "สั่งวันนี้", sum.now, sum.now ? "text-orange-700" : "m-ink2", "warn")
    + tile("soon", "ใกล้ถึงเวลา", sum.soon, sum.soon ? "m-warn" : "m-ink2", "warn")
    + (S.staleDays ? tile("stale", "ไม่อัปเดต", sum.stale || 0, sum.stale ? "m-must" : "m-ink2", "must") : "")
    + tile("ok",   "ยังพอ", sum.ok, "m-go", "ok")
    + tile("all",  "ทั้งหมด", sum.total, "");

  const rows = planRows();
  $("planList").innerHTML = rows.length ? rows.map(x => {
    const T = PLAN_TONE[x.status] || PLAN_TONE.nodata;
    const cover = x.daysCover === null || x.daysCover === undefined ? "—" : fmtNum(x.daysCover);
    const when = x.orderInDays === null || x.orderInDays === undefined ? "—"
      : x.status === "late" ? "เลยกำหนดแล้ว" : x.orderInDays <= 0 ? "วันนี้" : thDate(x.orderByDate) + " (อีก " + x.orderInDays + " วัน)";
    const src = { actual: "เบิกจริง", plan: "ค่าที่ตั้งไว้", thin: "เบิกจริง (ข้อมูลน้อย)" }[x.rateSource] || "";
    const act = (x.status === "ok" || x.status === "nodata" || planFilter === "stale") ? ""
      : `<span class="m-meta block">สั่งภายใน <b class="${T.text}">${when}</b> · แนะนำ <b style="color:var(--m-ink)">${x.suggestQty > 0 ? fmtNum(x.suggestQty) + " " + escH(x.unit) : "—"}</b></span>`;
    const why = (x.reasons || []).length
      ? `<span class="block m-ink2 text-xs mt-1 leading-relaxed">${x.reasons.map(t => "• " + escH(t)).join("<br>")}</span>` : "";
    return `<button onclick="planPick('${escJA(x.sku)}')" class="item-card m-row" style="align-items:start">
      ${mSign(planFilter === "stale" ? "must" : T.sign) || "<span></span>"}
      <span class="min-w-0"><span class="m-name block">${escH(x.name)}</span>
        <span class="m-meta block"><span class="font-black ${T.text}">${escH(x.statusText)}</span> · เหลือ ${fmtNum(x.qty)} ${escH(x.unit)}${x.rate > 0 ? " · ใช้ " + fmtNum(x.rate) + "/วัน" + (src ? " (" + src + ")" : "") : ""}</span>
        ${act}${why}</span>
      <span class="m-qty"><b class="${T.text}">${cover}</b><span>วันที่พอใช้</span></span>
    </button>`;
  }).join("") + '<p class="m-ink2 text-xs text-center font-bold pt-2 pb-1 leading-relaxed">แตะรายการเพื่อรับเข้า / เบิก / นับ<br>ตัวเลขเป็นคำแนะนำจากการเบิกจริง — ระบบไม่สั่งซื้อเอง</p>'
  : mEmptyHtml(planFilter === "todo" ? "✅ ไม่มีรายการที่ต้องสั่งในตอนนี้" : planFilter === "stale" ? "✅ ทุกรายการมีการอัปเดตตามกำหนด" : "ไม่มีรายการในกลุ่มนี้", "py-14");

  const n = planOrderList().length, btn = $("planCopyBtn");
  btn.textContent = n ? "คัดลอกรายการสั่ง (" + n + " รายการ)" : "ไม่มีรายการที่ต้องสั่งวันนี้";
  btn.disabled = !n;
  btn.classList.toggle("opacity-40", !n);
}
function planPick(sku) {
  if (!data.find(d => d.sku === sku)) { toast("ไม่พบรายการนี้ในคลัง ลองกดรีเฟรช", "warn"); return; }
  closePlan();
  pickItem(sku);
}
async function planCopy() {
  const list = planOrderList();
  if (!list.length) return;
  const txt = "📈 รายการที่ต้องสั่งซื้อ — " + MOD_CFG[mod].title + " (" + mod + ")\n" + thDate(planData.today) + "\n" +
    list.map((x, i) => (i + 1) + ". " + x.name + " — สั่ง " + fmtNum(x.suggestQty) + " " + x.unit +
      "\n    เหลือ " + fmtNum(x.qty) + " " + x.unit + (x.daysCover !== null ? " · พอใช้ " + fmtNum(x.daysCover) + " วัน" : "") + " · รอของ " + x.leadDays + " วัน").join("\n");
  if (navigator.share) { try { await navigator.share({ text: txt }); return; } catch (e) { /* กดยกเลิก → ตกไปคัดลอก */ } }
  try { await navigator.clipboard.writeText(txt); toast("คัดลอกแล้ว — วางในแชตได้เลย ✅"); }
  catch (e) { toast("คัดลอกไม่สำเร็จ", "err"); }
}

// ─────────────────────────────────────────────
// SCANNER
// ─────────────────────────────────────────────
function openScanner() {
  show("sScanner"); $("sScanner").style.display = "flex"; mArmBack();
  if (scanner) { try { scanner.stop().catch(()=>{}); } catch(e){} scanner = null; }
  $("scanEl").innerHTML = "";
  scanner = new Html5Qrcode("scanEl");
  scanner.start(
    { facingMode: "environment" },
    {
      fps: 12,
      qrbox: { width: 240, height: 180 },
      aspectRatio: 1.333,
    },
    onScan,
    () => {}   // ignore errors during scanning
  ).catch(err => {
    toast("เปิดกล้องไม่สำเร็จ", "err");
    closeScanner();
  });
}

function closeScanner() {
  if (scanner) {
    try { scanner.stop().catch(() => {}); } catch(e) {}
    scanner = null;
  }
  $("scanEl").innerHTML = "";
  const el = $("sScanner");
  if (el) { el.style.display = "none"; el.classList.add("hidden"); }
}

function onScan(decoded) {
  if (navigator.vibrate) navigator.vibrate([40, 20, 40]);
  closeScanner();

  // Try JSON QR from our system: {"m":"SQF","s":"SKU-001"}
  try {
    const obj = JSON.parse(decoded);
    if (obj.m && obj.s) {
      if (obj.m !== mod) {
        // Switch module if needed
        if (obj.m === "SQF" || obj.m === "MLM") {
          toast("QR นี้เป็นของ " + obj.m + " กำลังเปลี่ยนโมดูล...", "warn");
          selectModule(obj.m).then(() => pickItem(obj.s));
        } else {
          toast("QR นี้เป็นของ " + obj.m, "warn");
        }
        return;
      }
      const item = data.find(d => d.sku === obj.s);
      if (item) { pickItem(obj.s); return; }
      toast("ไม่พบรหัส " + obj.s, "warn"); return;
    }
  } catch(e) { /* not JSON */ }

  // Try RAWMAT|FACTORY|SKU format (จาก พิมพ์ QR วัตถุดิบ)
  if (decoded.startsWith("RAWMAT|")) {
    const parts = decoded.split("|");
    if (parts.length >= 3) {
      const qrFactory = parts[1];
      const qrSku     = parts[2];
      if (qrFactory !== mod) {
        toast("QR นี้เป็นของ " + qrFactory + " กำลังเปลี่ยนโมดูล...", "warn");
        selectModule(qrFactory).then(() => pickItem(qrSku));
      } else {
        const item = data.find(d => String(d.sku) === String(qrSku));
        if (item) { pickItem(qrSku); return; }
        toast("ไม่พบรหัส " + qrSku, "warn");
      }
      return;
    }
  }

  // Try match as raw SKU or barcode
  const found = data.find(d =>
    String(d.sku).toLowerCase() === decoded.toLowerCase() ||
    String(d.sku)               === decoded
  );
  if (found) { pickItem(found.sku); return; }

  toast("ไม่พบสินค้า: " + decoded.slice(0, 24), "warn");
}
